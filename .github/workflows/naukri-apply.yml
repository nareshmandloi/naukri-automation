name: Naukri Auto-Apply

on:
  schedule:
    # Hourly at :17 (UTC; :47 IST). Off the hour because GitHub drops on-the-
    # hour schedules first, and hourly because it drops some anyway: the daily
    # cap (DAILY_LIMIT, 50) rather than the run count is what bounds applies,
    # so a dropped run costs nothing. Never collides with the resume refresh
    # at :03/:33.
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Find and score matching jobs, but do not apply'
        type: boolean
        default: true
      max_applications:
        description: 'Maximum applications this run'
        type: string
        default: '10'

# Needed to push the application counter (state/applies.json).
permissions:
  contents: write

concurrency:
  group: naukri-auto-apply
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # Branch tip, so the run starts from the latest counter.
          ref: ${{ github.ref_name }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Restore resume from secret
        env:
          RESUME_BASE64: ${{ secrets.RESUME_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${RESUME_BASE64:-}" ]; then
            echo "::error::RESUME_BASE64 secret is not set. See README > Setup."
            exit 1
          fi
          mkdir -p resume
          printf '%s' "$RESUME_BASE64" | tr -d '[:space:]' | base64 -d > resume/base.pdf
          if [ "$(head -c 5 resume/base.pdf)" != "%PDF-" ]; then
            echo "::error::RESUME_BASE64 did not decode to a PDF. Re-copy the secret."
            exit 1
          fi

      - name: Apply to matching jobs
        env:
          NAUKRI_SESSION_B64: ${{ secrets.NAUKRI_SESSION_B64 }}
          # Screening-question answers (CTC, notice period, location). Without
          # it, jobs that ask questions are skipped rather than answered.
          CANDIDATE_PROFILE: ${{ secrets.CANDIDATE_PROFILE }}
          # Scheduled runs have no inputs, so they apply for real; a manual
          # run defaults to a dry run.
          DRY_RUN: ${{ inputs.dry_run }}
          MAX_APPLICATIONS: ${{ inputs.max_applications || vars.MAX_APPLICATIONS }}
          DAILY_LIMIT: ${{ vars.DAILY_LIMIT }}
          # Run report to your Telegram bot (see README > Telegram report).
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Optional tuning via Settings → Secrets and variables → Variables.
          SEARCH_KEYWORDS: ${{ vars.SEARCH_KEYWORDS }}
          JOB_LOCATIONS: ${{ vars.JOB_LOCATIONS }}
          MIN_MATCHED_SKILLS: ${{ vars.MIN_MATCHED_SKILLS }}
          MIN_MATCH_RATIO: ${{ vars.MIN_MATCH_RATIO }}
          YEARS_EXPERIENCE: ${{ vars.YEARS_EXPERIENCE }}
        run: npm run apply

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: apply-diagnostics-${{ github.run_number }}
          path: |
            artifacts/*.png
            artifacts/*.html
          retention-days: 7
          if-no-files-found: ignore

      - name: Commit application counter
        # always(): a run that applied to some jobs and then failed must still
        # record them, or the daily cap would undercount.
        if: always()
        run: |
          set -euo pipefail
          if git diff --quiet -- state/applies.json; then
            echo "Counter unchanged — nothing to commit."
            exit 0
          fi
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add state/applies.json
          git commit -m "chore: $(node -p "const c=require('./state/applies.json'); c.today+' applied today, '+c.total+' total'")"
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            echo "Push rejected (attempt $attempt) — rebasing on origin."
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          done
          echo "::error::Could not push the counter after 3 attempts."
          exit 1
